name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Sublime JSON files
        run: python3 scripts/check_settings.py

      - name: Byte-compile check scripts
        run: python3 -m py_compile scripts/*.py

      - name: Lint bootstrap.sh
        run: shellcheck bootstrap.sh
